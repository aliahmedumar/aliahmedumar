<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110B"/><stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#8A6214" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#E0A93A"/>
      <stop offset="1" stop-color="#8A6214" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#E0A93A" stop-opacity=".55"/><stop offset="1" stop-color="#E0A93A" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .rail{stroke:#2A2418;stroke-width:2;fill:none}
    .flow{stroke:url(#line);stroke-width:2;fill:none;stroke-dasharray:2 10;stroke-linecap:round;animation:dash 1.1s linear infinite}
    .back{stroke:#8A6214;stroke-width:1.5;fill:none;stroke-dasharray:2 9;stroke-linecap:round;opacity:.55;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .node{fill:#16130E;stroke:#2E271B;stroke-width:1.2;animation:pulse 6s infinite}
    @keyframes pulse{0%,9%{stroke:#E0A93A;fill:#211A0E}18%,100%{stroke:#2E271B;fill:#16130E}}
    .core{fill:#E0A93A;animation:core 6s infinite}
    @keyframes core{0%,9%{fill:#F2C25B}18%,100%{fill:#C08A1E}}
    .t{font-size:15px;font-weight:600;fill:#EDE3CF;text-anchor:middle}
    .s{font-size:11.5px;fill:#8C8070;text-anchor:middle;letter-spacing:.3px}
    .bar{fill:#E0A93A;transform-box:fill-box;transform-origin:center;animation:wave 1.2s ease-in-out infinite;opacity:.85}
    @keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .live{animation:blink 1.6s infinite}
    @keyframes blink{50%{opacity:.2}}
  </style>

  <rect width="940" height="270" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="939" height="269" rx="20" fill="none" stroke="#2A2418"/>

  <!-- title + waveform -->
  <circle class="live" cx="32" cy="38" r="4.5" fill="#E0A93A" filter="url(#glow)"/>
  <text x="46" y="43" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#C08A1E">SKIMMY · LIVE CALL</text>
  <g transform="translate(230,25)">
    <rect class="bar" x="0"  width="3" height="26" rx="1.5" style="animation-delay:0s"/>
    <rect class="bar" x="7"  width="3" height="26" rx="1.5" style="animation-delay:.12s"/>
    <rect class="bar" x="14" width="3" height="26" rx="1.5" style="animation-delay:.24s"/>
    <rect class="bar" x="21" width="3" height="26" rx="1.5" style="animation-delay:.36s"/>
    <rect class="bar" x="28" width="3" height="26" rx="1.5" style="animation-delay:.48s"/>
    <rect class="bar" x="35" width="3" height="26" rx="1.5" style="animation-delay:.6s"/>
    <rect class="bar" x="42" width="3" height="26" rx="1.5" style="animation-delay:.72s"/>
    <rect class="bar" x="49" width="3" height="26" rx="1.5" style="animation-delay:.84s"/>
  </g>

  <!-- outcomes pill -->
  <path class="back" d="M660,92 V40 H690" style="opacity:.9"/>
  <rect x="690" y="22" width="222" height="36" rx="18" fill="none" stroke="#C08A1E" stroke-opacity=".6"/>
  <text x="801" y="45" font-size="12.5" font-weight="600" fill="#E0A93A" text-anchor="middle">Book · Qualify · Route → CRM</text>

  <!-- rails + flowing connectors -->
  <path class="rail" d="M160,122 H780"/>
  <path class="flow" d="M160,122 H210 M350,122 H400 M540,122 H590 M730,122 H780"/>
  <path class="back" d="M850,152 V222 H90 V152"/>
  <text x="470" y="244" class="s">voice reply back to caller</text>

  <!-- nodes -->
  <rect class="node" x="20"  y="92" width="140" height="60" rx="12" style="animation-delay:0s"/>
  <text x="90"  y="118" class="t">Caller</text><text x="90" y="137" class="s">inbound call</text>

  <rect class="node" x="210" y="92" width="140" height="60" rx="12" style="animation-delay:.67s"/>
  <text x="280" y="118" class="t">Telephony</text><text x="280" y="137" class="s">call in / out</text>

  <rect class="node" x="400" y="92" width="140" height="60" rx="12" style="animation-delay:1.34s"/>
  <text x="470" y="118" class="t">Speech‑to‑Text</text><text x="470" y="137" class="s">transcribe</text>

  <rect class="core" x="590" y="92" width="140" height="60" rx="12" style="animation-delay:2.01s"/>
  <text x="660" y="118" class="t" style="fill:#14110B">LLM + Tools</text><text x="660" y="137" class="s" style="fill:#3A2C10">reason &amp; act</text>

  <rect class="node" x="780" y="92" width="140" height="60" rx="12" style="animation-delay:2.68s"/>
  <text x="850" y="118" class="t">Text‑to‑Speech</text><text x="850" y="137" class="s">natural voice</text>

  <!-- travelling packet with halo -->
  <g>
    <circle r="16" fill="url(#halo)"/>
    <circle r="4.5" fill="#F2C25B" filter="url(#glow)"/>
    <animateMotion dur="6s" repeatCount="indefinite" path="M90,122 H850 V222 H90 Z"/>
  </g>
</svg>
