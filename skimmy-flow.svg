<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .flow{stroke:#C08A1E;stroke-width:2.5;fill:none;stroke-dasharray:7 7;animation:dash 0.9s linear infinite}
    .back{stroke:#C08A1E;stroke-width:2;fill:none;stroke-dasharray:4 8;opacity:.6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .node{fill:#FFFDF8;stroke:#EADFC8;stroke-width:1.5;animation:pulse 6s infinite}
    @keyframes pulse{0%,9%{stroke:#C08A1E;stroke-width:3;fill:#FCEFD2}16%,100%{stroke:#EADFC8;stroke-width:1.5;fill:#FFFDF8}}
    .dark{fill:#1A1A1A;stroke:#1A1A1A;animation:pulseD 6s infinite}
    @keyframes pulseD{0%,9%{stroke:#C08A1E;stroke-width:3}16%,100%{stroke:#1A1A1A;stroke-width:1.5}}
    .t{font-size:16px;font-weight:700;fill:#1A1A1A;text-anchor:middle}
    .s{font-size:12px;fill:#7A6F5E;text-anchor:middle}
    .bar{fill:#C08A1E;transform-box:fill-box;transform-origin:center;animation:wave 1s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .live{animation:blink 1.4s infinite}
    @keyframes blink{50%{opacity:.25}}
  </style>

  <rect width="940" height="270" rx="22" fill="#FBF4E6"/>

  <!-- title + waveform -->
  <text x="28" y="42" font-size="13" font-weight="700" letter-spacing="2.5" fill="#C08A1E">SKIMMY · LIVE CALL</text>
  <circle class="live" cx="212" cy="37" r="5" fill="#C08A1E"/>
  <g transform="translate(228,24)">
    <rect class="bar" x="0"  y="0" width="4" height="26" rx="2" style="animation-delay:0s"/>
    <rect class="bar" x="8"  y="0" width="4" height="26" rx="2" style="animation-delay:.15s"/>
    <rect class="bar" x="16" y="0" width="4" height="26" rx="2" style="animation-delay:.3s"/>
    <rect class="bar" x="24" y="0" width="4" height="26" rx="2" style="animation-delay:.45s"/>
    <rect class="bar" x="32" y="0" width="4" height="26" rx="2" style="animation-delay:.6s"/>
    <rect class="bar" x="40" y="0" width="4" height="26" rx="2" style="animation-delay:.75s"/>
    <rect class="bar" x="48" y="0" width="4" height="26" rx="2" style="animation-delay:.9s"/>
  </g>

  <!-- outcomes pill -->
  <path class="flow" d="M660,92 V40 H690"/>
  <rect x="690" y="22" width="222" height="36" rx="18" fill="#1A1A1A"/>
  <text x="801" y="45" font-size="13" font-weight="600" fill="#FBF4E6" text-anchor="middle">Book · Qualify · Route → CRM</text>

  <!-- connectors -->
  <path class="flow" d="M160,122 H210 M350,122 H400 M540,122 H590 M730,122 H780"/>
  <path class="back" d="M850,152 V222 H90 V152"/>
  <text x="470" y="244" class="s">voice reply back to caller</text>

  <!-- nodes -->
  <rect class="node" x="20"  y="92" width="140" height="60" rx="14" style="animation-delay:0s"/>
  <text x="90"  y="118" class="t">Caller</text><text x="90" y="137" class="s">inbound call</text>

  <rect class="node" x="210" y="92" width="140" height="60" rx="14" style="animation-delay:.67s"/>
  <text x="280" y="118" class="t">Telephony</text><text x="280" y="137" class="s">call in / out</text>

  <rect class="node" x="400" y="92" width="140" height="60" rx="14" style="animation-delay:1.34s"/>
  <text x="470" y="118" class="t">Speech‑to‑Text</text><text x="470" y="137" class="s">transcribe</text>

  <rect class="dark" x="590" y="92" width="140" height="60" rx="14" style="animation-delay:2.01s"/>
  <text x="660" y="118" class="t" fill="#FBF4E6" style="fill:#FBF4E6">LLM + Tools</text><text x="660" y="137" class="s" style="fill:#D9C9A8">reason &amp; act</text>

  <rect class="node" x="780" y="92" width="140" height="60" rx="14" style="animation-delay:2.68s"/>
  <text x="850" y="118" class="t">Text‑to‑Speech</text><text x="850" y="137" class="s">natural voice</text>

  <!-- travelling packet -->
  <circle r="7" fill="#C08A1E" stroke="#FFFDF8" stroke-width="2">
    <animateMotion dur="6s" repeatCount="indefinite" path="M90,122 H850 V222 H90 Z"/>
  </circle>
</svg>
